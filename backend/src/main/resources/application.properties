spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.jwt.secret=${JWT_SECRET:TmV4QnVkZHlTdXBlclNlY3JldEtleUZvckpXVFRva2VuU2lnbmluZzIwMjYhIQ==}
app.jwt.access-expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000
app.otp.expiration-minutes=10

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@nexbuddy.com}

